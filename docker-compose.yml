version: '3.9'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: forecast_busts
      POSTGRES_USER: ncmrwf
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ncmrwf_secure_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncmrwf -d forecast_busts"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayudrishti_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayudrishti_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://ncmrwf:${DB_PASSWORD:-ncmrwf_secure_2026}@db:5432/forecast_busts
      SYNC_DATABASE_URL: postgresql://ncmrwf:${DB_PASSWORD:-ncmrwf_secure_2026}@db:5432/forecast_busts
      REDIS_URL: redis://redis:6379/0
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-pk.demo}
      SECRET_KEY: ${SECRET_KEY:-vayudrishti_secret_key_2026}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      MODEL_WEIGHTS_PATH: /app/models/bust_transformer_v1.pt
      SEED_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - model_weights:/app/models
    networks:
      - vayudrishti_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info -Q inference,ingest --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://ncmrwf:${DB_PASSWORD:-ncmrwf_secure_2026}@db:5432/forecast_busts
      SYNC_DATABASE_URL: postgresql://ncmrwf:${DB_PASSWORD:-ncmrwf_secure_2026}@db:5432/forecast_busts
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      MODEL_WEIGHTS_PATH: /app/models/bust_transformer_v1.pt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - model_weights:/app/models
    networks:
      - vayudrishti_net

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://ncmrwf:${DB_PASSWORD:-ncmrwf_secure_2026}@db:5432/forecast_busts
      SYNC_DATABASE_URL: postgresql://ncmrwf:${DB_PASSWORD:-ncmrwf_secure_2026}@db:5432/forecast_busts
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - vayudrishti_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-pk.eyJ1IjoiZGVtbyIsImEiOiJkZW1vIn0.demo}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - vayudrishti_net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - vayudrishti_net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin2026}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - vayudrishti_net

volumes:
  pgdata:
  model_weights:
  grafana_data:

networks:
  vayudrishti_net:
    driver: bridge
